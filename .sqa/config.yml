config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-accounting:
      branch: devel
      repo: https://github.com/ARGOeu/argo-accounting
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-peach-frigatebird.sh
        container: qc.acc_muggy-rose-chin
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-accounting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-pear-spitz.sh
        container: qc.doc_snoopy-silver-crane
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.randy-jade-gecko.sh
        container: qc.doc_sleazy-bistre-beagle
      github.com/ARGOeu/argo-accounting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-lime-dragonfly.sh
        container: qc.doc_cloudy-peach-slug
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-accounting licensee:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-yellow-weasel.sh
        container: qc.lic_tasty-goldenrod-llama
  QC.Met:
    repos:
      github.com/ARGOeu/argo-accounting cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-sepia-budgerigar.sh
        container: qc.met_messy-denim-gorilla
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-accounting checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-asparagus-zebra.sh
        container: qc.sty_nerdy-pumpkin-baboon
      github.com/ARGOeu/argo-accounting hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-white-koala.sh
        container: qc.sty_scanty-lavender-seal
      github.com/ARGOeu/argo-accounting jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.homey-ecru-caterpillar.sh
        container: qc.sty_baggy-cinnamon-markhor
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-accounting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-lilac-grasshopper.sh
        container: qc.ver_flimsy-tangerine-vole
timeout: 5400
