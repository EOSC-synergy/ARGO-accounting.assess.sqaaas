config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-accounting:
      branch: devel
      repo: https://github.com/ARGOeu/argo-accounting
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.flaky-pear-newfoundland.sh
        container: qc.acc_bumpy-ivory-setter
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-accounting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-amber-chamois.sh
        container: qc.doc_queasy-cerulean-bloodhound
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.sickly-wheat-dingo.sh
        container: qc.doc_cheeky-sangria-burmese
      github.com/ARGOeu/argo-accounting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-olive-beetle.sh
        container: qc.doc_tacky-green-schnauzer
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-accounting licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-brass-quetzal.sh
        container: qc.lic_crabby-mauve-salamander
  QC.Met:
    repos:
      github.com/ARGOeu/argo-accounting cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.lumpy-viridian-pinscher.sh
        container: qc.met_craggy-goldenrod-eel
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-accounting checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-dandelion-gibbon.sh
        container: qc.sty_beady-tan-audemer
      github.com/ARGOeu/argo-accounting hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.slaphappy-olive-dolphin.sh
        container: qc.sty_sleazy-bronze-oyster
      github.com/ARGOeu/argo-accounting jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-grey-dhole.sh
        container: qc.sty_skinny-cornflower-caterpillar
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-accounting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-lilac-gerbil.sh
        container: qc.ver_gamy-sapphire-cheetah
timeout: 5400
