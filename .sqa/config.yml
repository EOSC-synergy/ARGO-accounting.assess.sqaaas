config:
  credentials: []
  project_repos:
    github.com/ARGOeu/argo-accounting:
      branch: devel
      repo: https://github.com/ARGOeu/argo-accounting
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.baggy-vermilion-hamster.sh
        container: qc.acc_sleazy-crimson-zorse
  QC.Doc:
    repos:
      github.com/ARGOeu/argo-accounting find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-azure-capuchin.sh
        container: qc.doc_nippy-amethyst-uguisu
      github.com/ARGOeu/argo-accounting git:
        commands:
        - /usr/bin/env sh .sqa/script.lovely-salmon-newt.sh
        container: qc.doc_crabby-sangria-monster
      github.com/ARGOeu/argo-accounting markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.chummy-myrtle-lizard.sh
        container: qc.doc_blurry-malachite-camel
  QC.Lic:
    repos:
      github.com/ARGOeu/argo-accounting licensee:
        commands:
        - /usr/bin/env sh .sqa/script.scummy-pumpkin-capybara.sh
        container: qc.lic_craggy-champagne-frog
  QC.Met:
    repos:
      github.com/ARGOeu/argo-accounting cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.homely-copper-sloth.sh
        container: qc.met_gummy-carmine-fish
  QC.Sty:
    repos:
      github.com/ARGOeu/argo-accounting checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-lemon-bracke.sh
        container: qc.sty_squirrely-ecru-llama
      github.com/ARGOeu/argo-accounting hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.messy-aquamarine-pig.sh
        container: qc.sty_whiny-sapphire-rattlesnake
      github.com/ARGOeu/argo-accounting jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.homely-bistre-quetzal.sh
        container: qc.sty_trippy-fuchsia-antelope
  QC.Ver:
    repos:
      github.com/ARGOeu/argo-accounting get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-orchid-bongo.sh
        container: qc.ver_greasy-pear-toucan
timeout: 5400
